name: Build

# Disparo manual: Actions → Build → Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    name: macOS (universal)
    runs-on: macos-latest
    # Pra criar a tag e o release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # O binário universal precisa dos dois alvos.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Testes do backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # __VERSION__ vira a versão do app — que sai do package.json, via
      # `version` do tauri.conf.json. Publica direto: rodar o workflow já é o
      # ato deliberado, rascunho só adicionaria um clique.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin --bundles dmg
          tagName: v__VERSION__
          releaseName: Mac Cleaner v__VERSION__
          releaseDraft: false
